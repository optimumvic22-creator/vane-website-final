name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        # These Sanity values are compile-time placeholders, NOT real credentials.
        # sanity/env.ts throws at module load if they are missing, so the client
        # needs *some* value to construct. The runtime fetch then fails and the
        # pages fall back to their built-in content (see app/team/page.tsx). Production
        # deploys (Vercel) supply the real values via host-configured env vars.
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ci000000
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Production smoke test
        timeout-minutes: 3
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ci000000
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_WRITE_TOKEN: ''
          SMOKE_CHECK_HONEYPOT: '1'
        run: |
          log_file="$RUNNER_TEMP/vane-smoke.log"
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 --output /dev/null http://127.0.0.1:3000; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production server exited before readiness."
              tail -n 40 "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Production server did not become ready within the bounded startup window."
            tail -n 40 "$log_file"
            exit 1
          fi

          npm run smoke -- http://127.0.0.1:3000

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Block unresolved high and critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
